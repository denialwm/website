baseURL: "https://manual.denialwm.org/"
title: "Denial Manual"
languageCode: "en-us"
enableRobotsTXT: true
enableGitInfo: true

module:
  imports:
    - path: github.com/imfing/hextra

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false

menu:
  main:
    - name: Website
      url: "https://denialwm.org/"
      weight: 1
    - name: Manual
      pageRef: /docs
      weight: 2
    - name: Search
      weight: 3
      params:
        type: search
    - name: GitHub
      url: "https://github.com/denialwm/denial"
      weight: 4
      params:
        icon: github
    - name: Discord
      url: "https://discord.gg/PQBChmDYy"
      weight: 5
      params:
        icon: discord
    - name: Reddit
      url: "https://www.reddit.com/r/denialwm/"
      weight: 6
      params:
        icon: reddit

params:
  description: "Documentation for Denial, a Flutter-native Wayland compositor."

  navbar:
    displayTitle: false
    displayLogo: true
    logo:
      path: images/denial.svg
      dark: images/denial-dark.svg
      link: /
      width: 116
      height: 35

  theme:
    default: system
    displayToggle: true

  footer:
    displayCopyright: true
    displayPoweredBy: false

  editURL:
    enable: true
    base: "https://github.com/denialwm/website/edit/main/manual/content"
