baseURL: "https://manual.denialwm.org/"
title: "Denial Manual"
languageCode: "en-us"
enableRobotsTXT: true
enableGitInfo: true

module:
  imports:
    - path: github.com/imfing/hextra

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false

menu:
  main:
    - name: Manual
      pageRef: /docs
      weight: 1
    - name: Search
      weight: 2
      params:
        type: search
    - name: GitHub
      url: "https://github.com/denialwm/denial"
      weight: 3
      params:
        icon: github

params:
  description: "Documentation for the Denial Wayland compositor."

  navbar:
    displayTitle: true
    displayLogo: false

  theme:
    default: system
    displayToggle: true

  footer:
    displayCopyright: true
    displayPoweredBy: false

  editURL:
    enable: true
    base: "https://github.com/denialwm/website/edit/main/manual/content"
